<div id="stage">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric city of the EY Microsoft Business Applications practice">
    <defs>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1E2D46" flood-opacity="0.16"/>
      </filter>
    </defs>
    <g id="Lground"></g>
    <g id="Lbeams"></g>
    <g id="Lparts"></g>
    <g id="Lnodes"></g>
    <g id="Llabels"></g>
  </svg>
</div>

<!-- header: EY · divider · practice wordmark -->
<header id="brand">
  <img class="ey" alt="EY">
  <span class="divider"></span>
  <span class="wordmark">Microsoft AI · Business Applications</span>
</header>

<!-- top-right: Microsoft corporate mark, small, an alliance signal -->
<div id="ms-corner"><img class="ms" alt="Microsoft"></div>

<!-- client tenants: pick one to fly into its isolated environment -->
<div id="clients"></div>

<!-- people met, quiet, bottom-left -->
<div id="counter" role="status" aria-live="polite">people met · <b>0</b> / 50</div>

<div id="hint">
  <span><b>Drag</b> to orbit</span><span class="sep"></span>
  <span><b>Arrows</b> or <b>right-drag</b> to move</span><span class="sep"></span>
  <span><b>Scroll</b> to zoom</span><span class="sep"></span>
  <span><b>Click</b> a tenant</span>
</div>

<!-- zoom in / out (bottom-left, clear of the detail panel) -->
<div id="zoom" role="group" aria-label="Zoom">
  <button class="zoom-btn" data-act="in" aria-label="Zoom in">&#43;</button>
  <button class="zoom-btn" data-act="out" aria-label="Zoom out">&#8722;</button>
</div>

<button id="fs" aria-label="Toggle full screen" title="Full screen"><span class="fs-i">&#9974;</span></button>

<div id="footer"></div>
<div id="tag"></div>

<!-- detail panel -->
<aside id="panel" aria-label="Detail">
  <div class="p-head">
    <div class="p-logos"></div>
    <button class="p-close" aria-label="Close">&times;</button>
    <div class="p-eyebrow"></div>
    <h2></h2>
    <div class="p-life"></div>
  </div>
  <div class="p-body">
    <p class="p-does"></p>
    <div class="p-value-sec"><div class="p-cap">The value</div><div class="p-value"></div></div>
    <div class="p-built-sec"><div class="p-cap">Built with</div><div class="p-built"></div></div>
    <div class="p-run-sec"><div class="p-cap">Who runs it</div><div class="p-run"></div></div>
    <div class="p-proof-sec"><div class="p-cap">Proven at</div><div class="p-proof"></div></div>
  </div>
</aside>

<!-- right-side controls: kept after the panel so they slide clear when it opens -->
<!-- move pad: pan the view up / down / left / right -->
<div id="nav" role="group" aria-label="Move the view">
  <button class="nav-btn nav-tu" data-act="up" aria-label="Move up">&#9650;</button>
  <button class="nav-btn nav-rl" data-act="left" aria-label="Move left">&#9664;</button>
  <button class="nav-btn nav-rr" data-act="right" aria-label="Move right">&#9654;</button>
  <button class="nav-btn nav-td" data-act="down" aria-label="Move down">&#9660;</button>
</div>

<div id="actions">
  <button id="home">&#8962;&nbsp; Home</button>
  <div id="reset">&#8635;&nbsp; Reset view</div>
</div>

<!-- intro -->
<div id="intro">
  <div class="intro-card">
    <div class="intro-logos"><img class="ey" alt="EY"><span class="bar"></span><img class="ms" alt="Microsoft"></div>
    <div class="intro-eyebrow"></div>
    <h1><span class="h1-a"></span><span class="h1-b"></span></h1>
    <p class="lede"></p>
    <div class="intro-stats"></div>
    <button id="enter">Explore the platform &rarr;</button>
    <div class="intro-built">
      <span class="intro-built-cap">Built on the Microsoft cloud</span>
      <div class="intro-built-row"></div>
    </div>
    <p class="intro-note"></p>
  </div>
</div>
