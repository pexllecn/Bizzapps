<div id="stage">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric city of the EY Microsoft Business Applications practice">
    <defs>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1E2D46" flood-opacity="0.16"/>
      </filter>
    </defs>
    <g id="Lground"></g>
    <g id="Lbeams"></g>
    <g id="Lparts"></g>
    <g id="Lnodes"></g>
    <g id="Llabels"></g>
  </svg>
</div>

<!-- header: EY · divider · practice wordmark -->
<header id="brand">
  <img class="ey" alt="EY">
  <span class="divider"></span>
  <span class="wordmark">Microsoft AI · Business Applications</span>
</header>

<!-- top-right: Microsoft corporate mark, small, an alliance signal -->
<div id="ms-corner"><img class="ms" alt="Microsoft"></div>

<!-- client tenants: pick one to fly into its isolated environment -->
<div id="clients"></div>

<!-- people met, quiet, bottom-left -->
<div id="counter" role="status" aria-live="polite">people met · <b>0</b> / 50</div>

<div id="hint">
  <span><b>Drag</b> to orbit</span><span class="sep"></span>
  <span><b>Right-drag</b> to pan</span><span class="sep"></span>
  <span><b>Scroll</b> to zoom</span><span class="sep"></span>
  <span><b>Click</b> a tenant</span>
</div>

<div id="reset">&#8635;&nbsp; Reset view</div>
<div id="footer"></div>
<div id="tag"></div>

<!-- detail panel -->
<aside id="panel" aria-label="Detail">
  <div class="p-head">
    <div class="p-logos"></div>
    <button class="p-close" aria-label="Close">&times;</button>
    <div class="p-eyebrow"></div>
    <h2></h2>
    <div class="p-life"></div>
  </div>
  <div class="p-body">
    <p class="p-does"></p>
    <div class="p-value-sec"><div class="p-cap">The value</div><div class="p-value"></div></div>
    <div class="p-built-sec"><div class="p-cap">Built with</div><div class="p-built"></div></div>
    <div class="p-run-sec"><div class="p-cap">Who runs it</div><div class="p-run"></div></div>
    <div class="p-proof-sec"><div class="p-cap">Proven at</div><div class="p-proof"></div></div>
  </div>
</aside>

<!-- intro -->
<div id="intro">
  <div class="intro-card">
    <div class="intro-logos"><img class="ey" alt="EY"><span class="bar"></span><img class="ms" alt="Microsoft"></div>
    <h1></h1>
    <p class="lede"></p>
    <button id="enter">Explore the city &rarr;</button>
    <div class="intro-hint">Drag to orbit · scroll to zoom · click anything</div>
  </div>
</div>
