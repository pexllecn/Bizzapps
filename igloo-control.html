<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BizApps City · Igloo controller | EY</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050b18">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/ey-gov.css">
<style>
  body{background:#050b18;min-height:100vh}
  .ctl{max-width:720px;margin:0 auto;padding:18px 18px 60px}
  .hd{display:flex;align-items:center;gap:14px;padding:6px 0 18px;border-bottom:1px solid var(--hair)}
  .hd img{height:30px}
  .hd b{font-weight:300;font-size:22px;letter-spacing:-.02em}
  .hd b em{font-style:normal;color:var(--y)}
  .marks{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--hair-2);color:var(--ink-3)}
  .mk.ok{color:#57E188;border-color:rgba(87,225,136,.5)}
  .mk.warn{color:#FF9831;border-color:rgba(255,152,49,.5)}
  h3{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .b{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;border-radius:12px;border:1px solid var(--hair-2);
     background:rgba(243,238,228,.03);font-size:15px;text-align:left;color:var(--ink)}
  .b:active{transform:scale(.98)}
  .b .sw{width:12px;height:12px;border-radius:50%;background:var(--c,var(--y));flex:none}
  .b small{display:block;font-size:11px;color:var(--ink-3)}
  .b.on{background:var(--c,var(--y));border-color:var(--c,var(--y));color:#0b0f1a}
  .b.on small{color:rgba(11,15,26,.7)}
  .b.on .sw{background:#0b0f1a}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row .b{flex:1;justify-content:center;min-width:90px}
  .now{margin-top:10px;padding:16px;border-radius:12px;border:1px solid var(--hair);background:rgba(243,238,228,.03)}
  .now .k{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--c,var(--y))}
  .now p{margin:8px 0 0;font-size:17px;font-weight:300;line-height:1.45}
  .links{font-size:13px;color:var(--ink-3);line-height:1.8;word-break:break-all}
  .links code{color:var(--ink);font-family:var(--mono)}
  .links button{margin-left:6px;font-size:11px;font-weight:700;color:var(--y)}
</style>
</head>
<body>
<div class="ctl">
  <div class="hd">
    <img src="assets/img/ey.png" alt="EY">
    <b>BizApps <em>City</em> · Igloo</b>
    <div class="marks"><span class="mk" id="reach">Checking…</span><span class="mk" id="walls">Walls not open</span></div>
  </div>

  <div class="now" id="now"><div class="k">On the walls</div><p id="nowP">Waiting for the walls.</p></div>

  <h3>Landmarks</h3>
  <div class="grid" id="lm"></div>

  <h3>Journey</h3>
  <div class="row">
    <button class="b" data-c="prev">&#9664; Back</button>
    <button class="b" data-c="next">Next &#9654;</button>
    <button class="b" data-c="journey">&#8635; Restart</button>
    <button class="b" data-c="stop">Stop</button>
  </div>

  <h3>The room</h3>
  <div class="row">
    <button class="b" data-c="home">Overview</button>
    <button class="b" id="tour">Self-running tour</button>
  </div>
  <div class="row" style="margin-top:8px" id="times"></div>
  <div class="row" style="margin-top:8px">
    <button class="b" data-turn="-30">&#8634; Turn 30°</button>
    <button class="b" data-turn="-5">&#8634; 5°</button>
    <button class="b" data-turn="5">5° &#8635;</button>
    <button class="b" data-turn="30">Turn 30° &#8635;</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="b" id="card">Join card on the walls</button>
    <button class="b" data-c="reload">Reload the walls</button>
  </div>

  <h3>Addresses for this room</h3>
  <div class="links" id="links"></div>
</div>

<script src="assets/ey-content.js"></script>
<script src="assets/ey-icons.js"></script>
<script src="assets/ey-gov.js"></script>
<script>EYGOV.apply(window.BIZ);</script>
<script src="assets/igloo-room.js"></script>
<script>
(function () {
  "use strict";
  var BIZ = window.BIZ, C = BIZ.city;
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var room = ROOM.connect("control");
  var st = {};

  EYGOV.gate(function () { EYGOV.track("igloo.control", { room: room.code }); });

  $("#lm").innerHTML = C.clients.map(function (c) {
    return '<button class="b" data-id="' + c.id + '" style="--c:' + c.tone + '"><span class="sw"></span><span>' + esc(c.name) + "<small>" + esc(c.sector) + "</small></span></button>";
  }).join("") + '<button class="b" data-id="__ey" style="--c:#FFE600"><span class="sw"></span><span>EY · the hub<small>At the centre of the room</small></span></button>';
  $$("#lm [data-id]").forEach(function (b) { b.addEventListener("click", function () { room.send({ type: "select", id: b.dataset.id }); }); });
  $$("[data-c]").forEach(function (b) {
    b.addEventListener("click", function () {
      var c = b.dataset.c;
      room.send(c === "journey" ? { type: "journey", id: st.id } : { type: c });
    });
  });
  $$("[data-turn]").forEach(function (b) { b.addEventListener("click", function () { room.send({ type: "turn", deg: +b.dataset.turn }); }); });
  $("#tour").addEventListener("click", function () { room.send({ type: "tour", on: !st.tour }); });
  $("#card").addEventListener("click", function () { room.send({ type: "card", on: !st.card }); });
  $("#times").innerHTML = ["night", "blue", "dawn"].map(function (k) {
    return '<button class="b" data-time="' + k + '">' + ({ night: "Night", blue: "Blue hour", dawn: "Dawn" })[k] + "</button>";
  }).join("");
  $$("[data-time]").forEach(function (b) { b.addEventListener("click", function () { room.send({ type: "time", key: b.dataset.time }); }); });

  var base = location.href.split("?")[0].replace(/igloo-control\.html$/, "");
  var rq = room.code === "main" ? "" : "?room=" + room.code;
  var addrs = [["Walls", base + "igloo.html" + rq], ["Floor", base + "igloo-floor.html" + rq], ["Controller", base + "igloo-control.html" + rq]];
  $("#links").innerHTML = addrs.map(function (a, i) { return a[0] + ' <code>' + esc(a[1]) + '</code><button data-copy="' + i + '">Copy</button>'; }).join("<br>");
  $$("[data-copy]").forEach(function (b) { b.addEventListener("click", function () { try { navigator.clipboard.writeText(addrs[+b.dataset.copy][1]); b.textContent = "Copied"; } catch (e) {} }); });

  function paint() {
    var s = room.status();
    $("#reach").textContent = s.reach === "shared" ? "Shared room channel" : s.reach === "this browser only" ? "This browser only" : s.reach;
    $("#reach").className = "mk " + (s.reach === "shared" ? "ok" : "warn");
    $("#walls").textContent = s.walls ? "Walls live" : "Walls not open";
    $("#walls").className = "mk " + (s.walls ? "ok" : "warn");
    $$("#lm [data-id]").forEach(function (b) { b.classList.toggle("on", b.dataset.id === st.id); });
    $("#tour").classList.toggle("on", !!st.tour);
    $("#card").classList.toggle("on", !!st.card);
    $$("[data-time]").forEach(function (b) { b.classList.toggle("on", b.dataset.time === st.time); });
    var c = C.clients.filter(function (x) { return x.id === st.id; })[0];
    var line = "Overview: the whole city, the intro card at the front.";
    if (st.id === "__ey") line = "EY at the centre of the room.";
    else if (c) {
      var step = c.journey && c.journey[st.step];
      line = "<b>" + esc(c.name) + "</b>" + (step ? " · step " + (st.step + 1) + " of " + c.journey.length + "<br>" + esc(step.t) : "");
      $("#now").style.setProperty("--c", c.tone);
    }
    $("#nowP").innerHTML = line + (st.tour ? '<br><small style="color:var(--ink-3)">The tour is running; any command takes over.</small>' : "");
  }
  room.on("state", function (s) { st = s; paint(); });
  room.on("status", paint);
  setInterval(paint, 2000);
  paint();
})();
</script>
</body>
</html>
