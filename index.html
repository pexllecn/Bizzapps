<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EY · Microsoft Business Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ==========================================================================
 *  EY · Microsoft AI — Business Applications · the city
 *  Light, calm, roam-anywhere. Segoe UI → Inter fallback.
 * ========================================================================== */
:root{
  --bg1:#FBFCFE; --bg2:#EAF1FB; --bg3:#E3ECFA;
  --ink:#16233A; --ink2:#41536F; --soft:#68758C;
  --line:#DCE6F3; --card:#FFFFFF; --panel:#F4F7FC;
  --ey:#F3B700; --ey-ink:#2E2E38;
  --accent:#2E7AD1;
  --good:#2F9E6E;
  --shadow:0 24px 60px -22px rgba(23,45,85,.30);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(120% 90% at 50% -10%, #FFFFFF 0%, rgba(255,255,255,0) 45%),
    radial-gradient(90% 80% at 88% 6%, rgba(46,122,209,.08), transparent 55%),
    linear-gradient(180deg, var(--bg1), var(--bg2) 60%, var(--bg3));
  color:var(--ink);
  font-family:"Segoe UI","Inter",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
#stage{position:fixed;inset:0;z-index:1}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

.node{cursor:pointer;transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .5s ease,filter .2s ease;
  transform:translateY(34px);opacity:0}
.node.in{transform:translateY(0);opacity:1}
.node.in.hi{transform:translateY(-9px)}
.node.hi{filter:drop-shadow(0 14px 16px rgba(30,50,90,.22))}
.node:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
#scene.focus .node{opacity:.34;transition:opacity .3s}
#scene.focus .node.sel,#scene.focus .node.rel{opacity:1}
#scene.focus .beam{opacity:.06}
#scene.focus .beam.rel{opacity:1}
.beam{transition:opacity .3s}

/* ---------- header ---------- */
#brand{position:fixed;top:22px;left:26px;z-index:6;display:flex;align-items:center;gap:16px;
  opacity:0;transform:translateY(-8px);transition:opacity .7s,transform .7s}
#brand.in{opacity:1;transform:none}
#brand img.ey{height:34px;width:auto;display:block}          /* EY keeps its clear space */
#brand .divider{width:1px;height:26px;background:var(--line)}
#brand .wordmark{font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--ink)}

#ms-corner{position:fixed;top:26px;right:28px;z-index:6;opacity:0;transition:opacity .8s .1s}
#ms-corner.in{opacity:.55}
#ms-corner img{height:17px;width:auto;display:block}

/* client tiles — pick a tenant */
#clients{position:fixed;top:58px;right:28px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  opacity:0;transform:translateY(-8px);transition:opacity .8s .15s,transform .8s .15s}
#clients.in{opacity:1;transform:none}
#clients .cap{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.ctiles{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.ctile{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(6px);color:var(--ink2);font-size:12.5px;font-weight:600;cursor:pointer;transition:.16s}
.ctile .dot{width:9px;height:9px;border-radius:50%}
.ctile:hover{border-color:#C3D3E6;color:var(--ink)}
.ctile.on{background:#fff;border-color:#C3D3E6;color:var(--ink);box-shadow:0 2px 10px rgba(23,45,85,.08)}
.p-run-txt .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
@media(max-width:820px){#clients{display:none}}

/* ---------- people-met counter ---------- */
#counter{position:fixed;left:26px;bottom:22px;z-index:6;font-size:13px;color:var(--soft);
  letter-spacing:.02em;opacity:0;transform:translateY(8px);transition:opacity .9s .2s,transform .9s .2s}
#counter.in{opacity:1;transform:none}
#counter b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- hint / reset / footer ---------- */
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);z-index:6;display:flex;gap:16px;
  align-items:center;padding:8px 16px;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:999px;
  backdrop-filter:blur(8px);color:var(--ink2);font-size:12.5px;opacity:0;transition:opacity .9s .3s;pointer-events:none}
#hint.in{opacity:1}#hint b{color:var(--ink);font-weight:600}#hint .sep{width:1px;height:13px;background:var(--line)}
@media(max-width:900px){#hint{display:none}}

#reset{position:fixed;right:26px;bottom:22px;z-index:6;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;
  background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(8px);
  color:var(--ink2);font-size:12.5px;cursor:pointer;opacity:0;transition:opacity .9s .3s,color .2s,border-color .2s}
#reset.in{opacity:1}#reset:hover{color:var(--ink);border-color:#C3D3E6}
#panel.open~#reset{right:calc(min(438px,94vw) + 18px)}

#footer{position:fixed;left:50%;bottom:2px;transform:translateX(-50%);z-index:5;font-size:11.5px;color:#9AA8BC;
  text-align:center;max-width:70vw;opacity:0;transition:opacity 1s .5s;pointer-events:none}
#footer.in{opacity:1}
@media(max-width:900px){#footer{display:none}}

/* ---------- hover tag ---------- */
#tag{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-135%);padding:6px 11px;background:#fff;
  border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;opacity:0;
  transition:opacity .15s;box-shadow:var(--shadow)}
#tag.show{opacity:1}#tag .c{display:block;font-weight:500;font-size:10.5px;color:var(--soft);margin-top:1px}

/* ======================================================================
 *  PANEL
 * ==================================================================== */
#panel{position:fixed;top:0;right:0;height:100%;width:min(438px,94vw);z-index:9;background:rgba(255,255,255,.98);
  border-left:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(12px);transform:translateX(103%);
  transition:transform .42s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
#panel.open{transform:none}
.p-head{padding:26px 28px 20px;border-bottom:1px solid var(--line);position:relative}
.p-logos{position:absolute;top:26px;right:26px;display:flex;gap:8px;align-items:center}
.p-logos img,.p-logos span[role=img]{width:28px;height:28px}
.p-close{position:absolute;top:64px;right:24px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer;font-size:19px;line-height:1;display:grid;place-items:center;transition:.2s}
.p-close:hover{color:var(--ink);border-color:#C3D3E6}
.p-eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.p-head h2{font-size:25px;font-weight:800;letter-spacing:-.01em;margin:9px 44px 12px 0;line-height:1.15;text-wrap:balance}

/* lifecycle · Advise / Build / Run */
.p-life{display:flex;gap:8px;margin-top:2px}
.p-life-seg{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--soft);
  padding:5px 11px 5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff}
.p-life-seg .d{width:9px;height:9px;border-radius:50%;border:1.5px solid #C4CEDD;background:transparent}
.p-life-seg.on{color:var(--ink);border-color:#CFE0D6;background:#F1F8F3}
.p-life-seg.on .d{background:var(--good);border-color:var(--good);box-shadow:0 0 0 3px rgba(47,158,110,.14)}

.p-body{padding:22px 28px 40px;display:flex;flex-direction:column;gap:22px}
.p-does{font-size:15px;line-height:1.6;margin:0;color:var(--ink);max-width:62ch}
.p-cap{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:0 0 11px}

/* the three value lines */
.p-value{display:flex;flex-direction:column;gap:12px}
.p-vline{display:flex;gap:11px;font-size:14px;line-height:1.5;color:var(--ink)}
.p-vline .p-arrow{color:var(--ey);font-weight:800;flex:none;margin-top:1px}
.p-vline:nth-child(2) .p-arrow{color:var(--accent)}
.p-vline:nth-child(3) .p-arrow{color:var(--good)}

/* built-with chips */
.p-built{display:flex;flex-wrap:wrap;gap:8px}
.p-chip2{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--line);
  border-radius:999px;font-size:13px;font-weight:600;color:var(--ink)}
.p-chip2 img,.p-chip2 span[role=img]{width:16px;height:16px;flex:none}

/* who runs it */
.p-run{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.p-run-dots{display:inline-flex;gap:4px;flex-wrap:wrap;max-width:180px}
.p-run-dots i{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.85}
.p-run-txt{font-size:13.5px;color:var(--ink);font-weight:600}

/* proof links */
.p-proof{display:flex;flex-direction:column;gap:2px}
.p-proof-link{display:flex;align-items:center;gap:10px;padding:9px 4px;border:none;border-bottom:1px solid var(--line);
  background:none;color:var(--ink2);font-size:13.5px;cursor:pointer;text-align:left;width:100%;transition:color .18s;font-weight:600}
.p-proof-link:last-child{border-bottom:none}
.p-proof-link:hover{color:var(--ink)}
.p-proof-link .arw{color:var(--ey);font-weight:800}

/* ======================================================================
 *  INTRO
 * ==================================================================== */
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(90% 80% at 50% 0%, #fff, rgba(255,255,255,0) 55%),linear-gradient(180deg,var(--bg1),var(--bg2));
  transition:opacity .8s ease}
#intro.gone{opacity:0;pointer-events:none}
.intro-card{text-align:center;max-width:680px;padding:40px 26px;animation:rise .8s cubic-bezier(.22,.61,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.intro-logos{display:flex;align-items:center;justify-content:center;gap:22px;margin:0 auto 30px}
.intro-logos img{display:block;width:auto}
.intro-logos img.ey{height:58px}.intro-logos img.ms{height:30px}
.intro-logos .bar{width:1px;height:42px;background:var(--line)}
#intro h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.5px;line-height:1.08;margin:0 0 18px;
  color:var(--ink);text-wrap:balance;max-width:16ch;margin-inline:auto}
#intro .lede{font-size:clamp(15px,2vw,18px);color:var(--ink2);line-height:1.6;margin:0 auto 30px;max-width:52ch;text-wrap:balance}
#enter{font-weight:700;font-size:15px;color:#fff;background:linear-gradient(180deg,#3B8AE0,var(--accent));border:none;
  border-radius:999px;padding:15px 34px;cursor:pointer;box-shadow:0 14px 34px -12px rgba(46,122,209,.7);transition:transform .15s,box-shadow .2s}
#enter:hover{transform:translateY(-2px);box-shadow:0 20px 44px -12px rgba(46,122,209,.85)}
#enter:active{transform:translateY(0)}
.intro-hint{margin-top:20px;font-size:12px;color:var(--soft);letter-spacing:.02em}

/* ======================================================================
 *  MOBILE — panel becomes a bottom sheet
 * ==================================================================== */
@media(max-width:640px){
  #brand{top:16px;left:16px;gap:11px}#brand .wordmark{display:none}
  #counter{bottom:auto;top:16px;right:16px;left:auto}
  #ms-corner{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;height:auto;max-height:82vh;width:100%;
    border-left:none;border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(103%)}
  #panel.open{transform:none}
  #panel.open~#reset{right:16px}
  .p-head h2{font-size:22px}
}

@media(prefers-reduced-motion:reduce){
  .node{transition:opacity .3s;transform:none}
  #intro,.intro-card,#panel{transition:none}
}
</style>
</head><body>
<div id="stage">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric city of the EY Microsoft Business Applications practice">
    <defs>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1E2D46" flood-opacity="0.16"/>
      </filter>
    </defs>
    <g id="Lground"></g>
    <g id="Lbeams"></g>
    <g id="Lparts"></g>
    <g id="Lnodes"></g>
    <g id="Llabels"></g>
  </svg>
</div>

<!-- header: EY · divider · practice wordmark -->
<header id="brand">
  <img class="ey" alt="EY">
  <span class="divider"></span>
  <span class="wordmark">Microsoft AI · Business Applications</span>
</header>

<!-- top-right: Microsoft corporate mark, small, an alliance signal -->
<div id="ms-corner"><img class="ms" alt="Microsoft"></div>

<!-- client tenants: pick one to fly into its isolated environment -->
<div id="clients"></div>

<!-- people met, quiet, bottom-left -->
<div id="counter" role="status" aria-live="polite">people met · <b>0</b> / 50</div>

<div id="hint">
  <span><b>Drag</b> to orbit</span><span class="sep"></span>
  <span><b>Right-drag</b> to pan</span><span class="sep"></span>
  <span><b>Scroll</b> to zoom</span><span class="sep"></span>
  <span><b>Click</b> a tenant</span>
</div>

<div id="reset">&#8635;&nbsp; Reset view</div>
<div id="footer"></div>
<div id="tag"></div>

<!-- detail panel -->
<aside id="panel" aria-label="Detail">
  <div class="p-head">
    <div class="p-logos"></div>
    <button class="p-close" aria-label="Close">&times;</button>
    <div class="p-eyebrow"></div>
    <h2></h2>
    <div class="p-life"></div>
  </div>
  <div class="p-body">
    <p class="p-does"></p>
    <div class="p-value-sec"><div class="p-cap">The value</div><div class="p-value"></div></div>
    <div class="p-built-sec"><div class="p-cap">Built with</div><div class="p-built"></div></div>
    <div class="p-run-sec"><div class="p-cap">Who runs it</div><div class="p-run"></div></div>
    <div class="p-proof-sec"><div class="p-cap">Proven at</div><div class="p-proof"></div></div>
  </div>
</aside>

<!-- intro -->
<div id="intro">
  <div class="intro-card">
    <div class="intro-logos"><img class="ey" alt="EY"><span class="bar"></span><img class="ms" alt="Microsoft"></div>
    <h1></h1>
    <p class="lede"></p>
    <button id="enter">Explore the city &rarr;</button>
    <div class="intro-hint">Drag to orbit · scroll to zoom · click anything</div>
  </div>
</div>
<script>
/* ============================================================================
 *  THE CITY · content model  (edit copy here; geometry lives in ms-iso.js)
 *  ---------------------------------------------------------------------------
 *  EY — Microsoft AI · Business Applications. 50 people, six districts, three
 *  proof landmarks. Every building is something this practice does on Microsoft.
 *
 *  Each building's `value` is EXACTLY THREE lines, in fixed order:
 *    [0] business outcome — what changes for the client, in their language
 *    [1] how fast / what it costs — a real number (commercials // VERIFY)
 *    [2] why EY, not a pure-play — the full-firm wrap, specific each time
 * ========================================================================== */
window.CITY = {
  practice: {
    name: "BizzApps",
    wordmark: "Microsoft AI · Business Applications",
    hero: {
      headline: "Every client on their own tenant. Never one shared platform.",
      sub: "Each island is a separate Microsoft tenant with its own governed Dataverse — isolated by design. Explore each client’s environment; click any building to see what we run for them and what it’s worth.",
    },
    footer: "One practice, many isolated tenants — we bring Microsoft AI into each client and run it where the stakes are highest.",
  },

  substrate: {
    core: "dataverse",
    label: "Separate tenants · isolated Dataverse · Azure · Fabric · Purview",
    etched: ["azure", "fabric", "purview"],
  },

  /* six districts — spatial groupings, colour + team. NOT filters. */
  districts: [
    { id: "A", name: "Customer & Contact",   color: "#C4399B", center: [0.2, 0.5],   lead: "Terry Maguire",  headcount: 16 },
    { id: "B", name: "Power Factory & C4E",  color: "#7A57B5", center: [-7.2, -3.0],  lead: "Harry Corbally", headcount: 14 },
    { id: "C", name: "Portfolio & Project",  color: "#12A5A5", center: [6.8, -3.2],   headcount: 6 },
    { id: "D", name: "Field & Operations",   color: "#E2A310", center: [7.3, 2.1],    lead: "Gerry Reid",     headcount: 5 },
    { id: "E", name: "Run",                  color: "#2F9E6E", center: [-5.6, 4.6],   headcount: 4 },
    { id: "F", name: "Data, AI & Platform",  color: "#2E7AD1", center: [4.4, 4.9],    headcount: 5 },
  ],

  buildings: [
    /* ---- District A · Customer & Contact ---- */
    {
      id: "contact-centre", district: "A", flagship: true, pos: [0.2, -0.9], h: 2.7, size: 1.45,
      name: "Digital Contact Centre",
      microsoftProducts: ["d365-contact-center", "copilot", "azure-ai"],
      whatItDoes: "A national-scale contact centre on Dynamics 365 — voice, chat and case in one place, with Copilot drafting replies and summarising every interaction for the agent.",
      value: [
        "Citizens get through and get answers. Agents handle more, with the full history and a suggested next step in front of them — not five screens and a hold queue.",
        "Live in 10–14 weeks on a proven blueprint; from ~€350k for a production contact centre, scaling with agent seats. // VERIFY",
        "We’ve run one for real — around 100 agents engaging 200,000+ citizens through the HSE breach. EY brings Cyber, Data Protection and Change in the same team; a pure-play can’t staff that.",
      ],
      lifecycle: ["advise", "build", "run"], pod: { headcount: 6, lead: "Terry Maguire" }, proof: ["hse"],
    },
    {
      id: "customer-service", district: "A", pos: [-2.9, 0.3], h: 1.7, size: 1.2,
      name: "Customer Service & Case Management",
      microsoftProducts: ["d365-customer-service"],
      whatItDoes: "Case management for high-volume service teams — routing, SLAs, knowledge and reporting on Dynamics 365 Customer Service.",
      value: [
        "Every case tracked to resolution against an SLA, so nothing is lost between teams and managers see the backlog before it becomes a headline.",
        "8–12 weeks to a live queue; from ~€180k depending on integrations. // VERIFY",
        "EY wraps the operating model and workforce change around the tech, and Digital Assurance stands behind the numbers you report to a regulator.",
      ],
      lifecycle: ["build", "run"], pod: { headcount: 4, lead: "Terry Maguire" }, proof: ["hse"],
    },
    {
      id: "self-service", district: "A", pos: [3.0, 0.2], h: 1.5, size: 1.2,
      name: "Self-Service & Citizen Portals",
      microsoftProducts: ["power-pages"],
      whatItDoes: "Secure public-facing portals on Power Pages where citizens self-serve — apply, upload, track status — without calling anyone.",
      value: [
        "The simple requests never reach an agent, so the phones stay free for the ones that need a human.",
        "6–8 weeks to a branded, accessible portal; from ~€90k. // VERIFY",
        "Accessibility and identity built to public-service standard and assured by EY — a portal a department can defend at committee, not just demo.",
      ],
      lifecycle: ["build"], pod: { headcount: 3, lead: "Terry Maguire" }, proof: ["doj"],
    },
    {
      id: "agent-copilot", district: "A", pos: [0.5, 2.7], h: 1.6, size: 1.2,
      name: "Agent Copilot & Conversational AI",
      microsoftProducts: ["copilot-studio", "azure-ai"],
      whatItDoes: "Custom copilots and conversational agents built in Copilot Studio, grounded in the client’s own knowledge and connected to Dynamics.",
      value: [
        "Routine questions answered in seconds, day or night, with every answer traceable to a source the organisation controls.",
        "A first agent in 4–6 weeks; from ~€75k, then iterate. // VERIFY",
        "EY’s Responsible AI and Cyber teams govern what the agent can say and see — the difference between a demo and something you’ll put in front of the public.",
      ],
      lifecycle: ["advise", "build"], pod: { headcount: 3, lead: "Terry Maguire" }, proof: ["hse"],
    },

    /* ---- District B · Power Factory & C4E ---- */
    {
      id: "c4e", district: "B", pos: [-8.1, -3.9], h: 1.9, size: 1.25,
      name: "Centre for Enablement (C4E)",
      microsoftProducts: ["power-platform", "purview"],
      whatItDoes: "A Centre for Enablement that lets a client’s own people build on Power Platform safely — standards, guardrails, reuse and governance with Purview.",
      value: [
        "Hundreds of citizen developers shipping without a shadow-IT mess — one governed platform instead of a thousand unmanaged apps.",
        "Stood up in 12 weeks at ~€285k, then it pays for itself as delivery moves in-house.",
        "EY sets the governance a board will sign off — Cyber, Data Protection and Risk in the room — not just a tenant with the settings turned on.",
      ],
      lifecycle: ["advise", "build"], pod: { headcount: 3, lead: "Harry Corbally" },
    },
    {
      id: "power-activate", district: "B", pos: [-6.3, -4.1], h: 1.5, size: 1.15,
      name: "Power Activate",
      microsoftProducts: ["power-apps", "power-automate"],
      whatItDoes: "A fast-start engagement that turns one painful manual process into a working app and an automated flow.",
      value: [
        "The spreadsheet-and-email process becomes an app people actually use, with the hand-offs automated end to end.",
        "8 weeks, fixed at ~€115k — a real thing in production, not a proof of concept.",
        "It lands inside EY’s wider transformation, so the quick win connects to the target operating model instead of becoming another island.",
      ],
      lifecycle: ["build"], pod: { headcount: 3, lead: "Harry Corbally" },
    },
    {
      id: "app-factory", district: "B", pos: [-8.3, -2.0], h: 1.6, size: 1.2,
      name: "App Factory",
      microsoftProducts: ["power-apps", "dataverse"],
      whatItDoes: "An industrialised app-delivery capability on Power Apps and Dataverse — a backlog of business apps built to a common standard.",

<script>
/* ============================================================================
 *  LOGO SYSTEM  ·  single source of truth for every product / brand mark
 *  ---------------------------------------------------------------------------
 *  Real marks are inlined as data URIs at build time into window.ICONS[key]
 *  (build.sh reads icons/ and maps files to these keys). A key with no asset
 *  degrades to a NEUTRAL FALLBACK: a rounded square in the product's official
 *  brand colour carrying a short monogram — never a drawn approximation of the
 *  real mark — and logs a console warning naming the missing key.
 * ========================================================================== */
(function () {
  const M = {
    // key                    label                               brand      mono
    "microsoft":            ["Microsoft",                         "#5E5E5E", "MS"],
    "dynamics365":          ["Dynamics 365",                      "#0B53CE", "365"],
    "d365-contact-center":  ["Dynamics 365 Contact Center",       "#0B53CE", "CC"],
    "d365-customer-service":["Dynamics 365 Customer Service",     "#0B53CE", "CS"],
    "d365-field-service":   ["Dynamics 365 Field Service",        "#0B53CE", "FS"],
    "d365-sales":           ["Dynamics 365 Sales",                "#0B53CE", "Sa"],
    "d365-project-ops":     ["Dynamics 365 Project Operations",   "#0B53CE", "PO"],
    "power-apps":           ["Power Apps",                        "#742774", "PA"],
    "power-automate":       ["Power Automate",                    "#0066FF", "PU"],
    "power-bi":             ["Power BI",                          "#E8A200", "BI"],
    "power-pages":          ["Power Pages",                       "#0E7C8B", "PP"],
    "power-platform":       ["Power Platform",                    "#742774", "PP"],
    "dataverse":            ["Dataverse",                         "#916AC8", "DV"],
    "copilot":              ["Copilot",                           "#7A5CD6", "Co"],
    "copilot-studio":       ["Copilot Studio",                    "#7A5CD6", "CS"],
    "azure":                ["Azure",                             "#0078D4", "Az"],
    "azure-ai":             ["Azure AI",                          "#0078D4", "AI"],
    "fabric":               ["Microsoft Fabric",                  "#117865", "Fa"],
    "purview":              ["Microsoft Purview",                 "#3B7A3D", "Pv"],
    "teams":                ["Microsoft Teams",                   "#5B5FC7", "Te"],
    "sharepoint":           ["SharePoint",                        "#036C70", "SP"],
    "m365":                 ["Microsoft 365",                     "#D83B01", "365"],
  };

  const manifest = {};
  for (const k in M) manifest[k] = { label: M[k][0], color: M[k][1], mono: M[k][2], alt: M[k][0] + " logo" };

  const warned = {};
  function assetFor(key) {
    const url = (window.ICONS || {})[key];
    if (!url && !warned[key]) { warned[key] = 1; console.warn("[logos] missing asset for product key: " + key + " — using monogram fallback"); }
    return url || null;
  }
  const get = (key) => manifest[key] || { label: key, color: "#8A93A6", mono: (key || "?").slice(0, 2).toUpperCase(), alt: key };

  /* HTML mark (panels, header) → returns an HTMLElement sized `size` px */
  function html(key, size) {
    const m = get(key), url = assetFor(key);
    if (url) {
      const img = document.createElement("img");
      img.src = url; img.alt = m.alt; img.width = size; img.height = size;
      img.style.cssText = "display:block;width:" + size + "px;height:" + size + "px;object-fit:contain";
      return img;
    }
    const d = document.createElement("span");
    d.setAttribute("role", "img"); d.setAttribute("aria-label", m.alt);
    d.textContent = m.mono;
    d.style.cssText = "display:inline-flex;align-items:center;justify-content:center;width:" + size +
      "px;height:" + size + "px;border-radius:" + Math.round(size * 0.24) + "px;background:" + m.color +
      ";color:#fff;font-weight:700;font-size:" + Math.round(size * 0.42) + "px;letter-spacing:-.02em;font-family:'Segoe UI',Inter,sans-serif";
    return d;
  }

  /* SVG mark (scene billboards) → appends into `parent`, centred, ~`half`-radius */
  const NS = "http://www.w3.org/2000/svg";
  function svg(parent, key, half) {
    const m = get(key), url = assetFor(key);
    if (url) {
      const im = document.createElementNS(NS, "image");
      im.setAttribute("x", -half); im.setAttribute("y", -half);
      im.setAttribute("width", half * 2); im.setAttribute("height", half * 2);
      im.setAttribute("preserveAspectRatio", "xMidYMid meet");
      im.setAttribute("href", url); im.setAttributeNS("http://www.w3.org/1999/xlink", "href", url);
      parent.appendChild(im);
      return;
    }
    const r = document.createElementNS(NS, "rect");
    const s = half * 2, rad = half * 0.5;
    r.setAttribute("x", -half); r.setAttribute("y", -half); r.setAttribute("width", s); r.setAttribute("height", s);
    r.setAttribute("rx", rad); r.setAttribute("fill", m.color);
    parent.appendChild(r);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", 0); t.setAttribute("y", half * 0.06); t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central"); t.setAttribute("fill", "#fff");
    t.setAttribute("font-weight", "700"); t.setAttribute("font-size", half * 0.85);
    t.setAttribute("font-family", "'Segoe UI',Inter,sans-serif");
    t.textContent = m.mono; parent.appendChild(t);
  }

  /* a "Built with" chip: real/fallback logo + product name, tinted by brand */
  function chip(key) {
    const m = get(key);
    const c = document.createElement("span");
    c.className = "p-chip2";
    c.style.background = m.color + "14";           // 8% tint
    c.style.borderColor = m.color + "33";
    c.appendChild(html(key, 16));
    const s = document.createElement("span"); s.textContent = m.label; c.appendChild(s);
    return c;
  }

  window.LOGOS = { manifest, get, html, svg, chip };
})();

</script>
<script>
/* ==========================================================================
 *  POWER PLATFORM LANDSCAPE · isometric engine (pure SVG, no dependencies)
 *  Draws a light, colourful isometric scene: a Dataverse core, the Power
 *  Platform services around it (with product marks), and the business
 *  solutions we built as buildings, linked by animated data flows.
 *  Product marks are simplified, brand-coloured interpretations.
 * ========================================================================== */
(function () {
  "use strict";
  const D = window.CITY;
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const L = window.LOGOS;
  const NS = "http://www.w3.org/2000/svg";
  const $ = (s) => document.querySelector(s);

  const TILE = 92;
  const COS30 = Math.cos(Math.PI / 6);
  // yaw rotates the scene on the ground plane; pitch tilts the camera elevation.
  // Together they give a free orbit in all orientations.
  let yaw = 0, cosY = 1, sinY = 0, pitch = 0.5;
  function setYaw(a) { yaw = a; cosY = Math.cos(a); sinY = Math.sin(a); }
  function setPitch(p) { pitch = Math.max(0.26, Math.min(0.72, p)); }
  const iso = (x, y, z) => {
    const rx = x * cosY - y * sinY, ry = x * sinY + y * cosY;
    return [(rx - ry) * COS30 * TILE, (rx + ry) * pitch * TILE - z * TILE];
  };
  const depthOf = (p) => (p[0] * cosY - p[1] * sinY) + (p[0] * sinY + p[1] * cosY);
  // inverse of iso() on the ground plane (z=0): screen/scene point → tile (x,y)
  function unproject(sx, sy) {
    const A = sx / (COS30 * TILE), B = sy / (pitch * TILE);
    const rx = (A + B) / 2, ry = (B - A) / 2;
    return { x: rx * cosY + ry * sinY, y: -rx * sinY + ry * cosY };
  }

  const districtById = {};
  D.districts.forEach((d) => (districtById[d.id] = d));
  const LANDMARK = "#F3B700";        // EY-yellow beacon for proof landmarks
  const colorOf = (b) => b.landmark ? "#5A6577" : (districtById[b.district] ? districtById[b.district].color : "#5A6577");

  // deterministic 0..1 hash so code-screen lines stay stable across redraws
  function hash(str) {
    str = String(str);
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0) / 4294967295;
  }

  // neon accents (glow bar / LEDs / on-screen code) derived from a base colour
  function glowFor(hex) {
    return { bar: shade(hex, 0.55), led: shade(hex, 0.75), code: shade(hex, 0.6) };
  }

  /* ---------- svg helpers ---------- */
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function href(node, url) {
    node.setAttribute("href", url);
    node.setAttributeNS("http://www.w3.org/1999/xlink", "href", url);
  }
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  function bd(x, y) { if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
  function poly(parent, pts, fill, extra) {
    let s = "";
    for (const p of pts) { s += p[0].toFixed(1) + "," + p[1].toFixed(1) + " "; bd(p[0], p[1]); }
    el("polygon", Object.assign({ points: s.trim(), fill }, extra || {}), parent);
  }
  function shade(hex, f) {
    let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
    else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
    return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
  }

  /* ---------- an isometric box (3 visible faces) ---------- */
  function isoBox(parent, gx, gy, w, d, h, base, floors) {
    const xm = gx - w / 2, xM = gx + w / 2, ym = gy - d / 2, yM = gy + d / 2;
    const P = (x, y, z) => iso(x, y, z);
    const Bh = P(xM, ym, h), Ch = P(xM, yM, h), Dh = P(xm, yM, h), Ah = P(xm, ym, h);
    const B0 = P(xM, ym, 0), C0 = P(xM, yM, 0), D0 = P(xm, yM, 0);
    // left/front face (y = yM)
    poly(parent, [Dh, Ch, C0, D0], shade(base, -0.04));
    // right face (x = xM)
    poly(parent, [Bh, Ch, C0, B0], shade(base, -0.20));
    // subtle floor lines on the right face
    if (floors) {
      for (let i = 1; i < floors; i++) {
        const z = (h / floors) * i;
        const a = P(xM, ym, z), b = P(xM, yM, z);
        el("line", { x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1),
          stroke: shade(base, -0.34), "stroke-width": 1, opacity: 0.6 }, parent);
      }
    }
    // top face
    poly(parent, [Ah, Bh, Ch, Dh], shade(base, 0.30), { stroke: shade(base, 0.42), "stroke-width": 1 });
    return { top: iso(gx, gy, h), ground: iso(gx, gy, 0) };
  }

  /* ---- a detailed isometric SERVER TOWER: stacked rack units with glowing
         light bars, indicator LEDs and a code screen on top ---- */
  function serverTower(parent, gx, gy, w, d, h, base, glow, units) {
    const xm = gx - w / 2, xM = gx + w / 2, ym = gy - d / 2, yM = gy + d / 2;
    const uh = h / units, gap = uh * 0.14;
    // pick the two viewer-facing vertical faces for the current orbit angle
    const faces = [
      { axis: "x", k: xM, a0: ym, a1: yM, c: [xM, gy] },
      { axis: "x", k: xm, a0: ym, a1: yM, c: [xm, gy] },
      { axis: "y", k: yM, a0: xm, a1: xM, c: [gx, yM] },
      { axis: "y", k: ym, a0: xm, a1: xM, c: [gx, ym] },
    ];
    faces.forEach((f) => (f.depth = depthOf(f.c)));
    faces.sort((p, q) => q.depth - p.depth);
    const vis = faces.slice(0, 2);
    const P = (f, a, z) => (f.axis === "x" ? iso(f.k, a, z) : iso(a, f.k, z));
    const faceX = (f) => iso(f.c[0], f.c[1], 0)[0];
    vis.sort((p, q) => faceX(p) - faceX(q));   // left face first, right face last
    vis.forEach((f, fi) => {
      const sh = fi === 0 ? -0.04 : -0.20;     // left lighter, right darker
      const len = f.a1 - f.a0;
      for (let i = 0; i < units; i++) {
        const z0 = i * uh + gap * 0.5, z1 = (i + 1) * uh - gap * 0.5;
        poly(parent, [P(f, f.a0, z1), P(f, f.a1, z1), P(f, f.a1, z0), P(f, f.a0, z0)], shade(base, sh));
        el("line", { x1: P(f, f.a0, z1)[0], y1: P(f, f.a0, z1)[1], x2: P(f, f.a1, z1)[0], y2: P(f, f.a1, z1)[1],
          stroke: shade(base, -0.34), "stroke-width": 1 }, parent);
        // glowing light bar near the top of the unit
        const b1 = z1 - uh * 0.16, b0 = z1 - uh * 0.34;
        poly(parent, [P(f, f.a0, b1), P(f, f.a1, b1), P(f, f.a1, b0), P(f, f.a0, b0)], glow.bar);
        // indicator LEDs near the bottom of the unit
        const l1 = z0 + uh * 0.52, l0 = z0 + uh * 0.30;
        for (let k = 0; k < 3; k++) {
          const c0 = f.a0 + len * (0.24 + 0.24 * k), c1 = c0 + len * 0.11;
          poly(parent, [P(f, c0, l1), P(f, c1, l1), P(f, c1, l0), P(f, c0, l0)], k === 1 ? glow.led : "#F2F8FF");
        }
      }
    });
    // top: bright cap + inset dark "screen" with tiny code lines
    const R = (x, y, z) => iso(x, y, z);
    const Ah = R(xm, ym, h), Bh = R(xM, ym, h), Ch = R(xM, yM, h), Dh = R(xm, yM, h);
    poly(parent, [Ah, Bh, Ch, Dh], shade(base, 0.32), { stroke: shade(base, 0.46), "stroke-width": 1 });
    const q = 0.17;
    poly(parent, [R(xm + w * q, ym + d * q, h), R(xM - w * q, ym + d * q, h),
      R(xM - w * q, yM - d * q, h), R(xm + w * q, yM - d * q, h)], "#101D34");
    for (let r = 0; r < 4; r++) {
      const yy = ym + d * (0.30 + 0.13 * r);
      const x0 = xm + w * 0.26, x1 = xm + w * (0.42 + 0.30 * hash(gx + "" + gy + r));
      const a = R(x0, yy, h), b = R(x1, yy, h);
      el("line", { x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1),
        stroke: glow.code, "stroke-width": 1.5, "stroke-linecap": "round", opacity: 0.9 }, parent);
    }
    return { top: iso(gx, gy, h), ground: iso(gx, gy, 0) };
  }

  /* ---- a glowing isometric DATABASE CYLINDER (for the Dataverse core) ---- */
  function dbTower(parent, gx, gy, size, h, base, glow) {
    const A = iso(gx, gy, 0);
    const R = size * TILE * 0.5, ry = R * 0.5, H = h * TILE;
    const cx = A[0], cyB = A[1], cyT = A[1] - H;
    // base shadow + bottom cap
    el("ellipse", { cx, cy: cyB + 6, rx: R * 1.05, ry: ry * 1.05, fill: "#1E2D46", opacity: 0.12 }, parent);
    el("ellipse", { cx, cy: cyB, rx: R, ry, fill: shade(base, -0.16) }, parent);
    // cylinder body
    el("rect", { x: cx - R, y: cyT, width: R * 2, height: H, fill: shade(base, -0.04) }, parent);
    // soft vertical gloss
    el("rect", { x: cx - R * 0.34, y: cyT, width: R * 0.5, height: H, fill: shade(base, 0.14), opacity: 0.5 }, parent);
    // glowing rings
    [0.30, 0.58, 0.86].forEach((f) => {
      const y = cyT + H * f;
      el("ellipse", { cx, cy: y, rx: R, ry, fill: "none", stroke: glow.bar, "stroke-width": 5 }, parent);
      el("ellipse", { cx, cy: y - 1.5, rx: R, ry, fill: "none", stroke: "#FFFFFF", "stroke-width": 1.4, opacity: 0.6 }, parent);
    });
    // top disk
    el("ellipse", { cx, cy: cyT, rx: R, ry, fill: shade(base, 0.30), stroke: shade(base, 0.46), "stroke-width": 1.5 }, parent);
    el("ellipse", { cx, cy: cyT, rx: R * 0.62, ry: ry * 0.62, fill: "none", stroke: glow.bar, "stroke-width": 2, opacity: 0.85 }, parent);
    bd(cx - R, cyT - ry - 6); bd(cx + R, cyB + ry + 8);
    return { top: [cx, cyT], ground: [cx, cyB] };
  }

  /* =====================================================================
   *  Simplified Microsoft product marks (brand-coloured, screen-aligned)
   *  drawn in a ~28px box centred at the origin.
   * =================================================================== */
  const rrect = (p, x, y, w, h, r, fill, extra) => el("rect", Object.assign({ x, y, width: w, height: h, rx: r, fill }, extra || {}), p);
  const M = {
    dataverse(g) {
      [["#B98BE6", -10], ["#9B63D6", -1.5], ["#7D45C0", 7]].forEach(([c, y]) =>
        rrect(g, -12, y, 24, 6.5, 3, c));
    },
    powerapps(g) {
      el("polygon", { points: "0,-13 13,0 0,13 -13,0", fill: "#742774" }, g);
      el("polygon", { points: "0,-6.5 6.5,0 0,6.5 -6.5,0", fill: "none", stroke: "#E7D6F2", "stroke-width": 2.4 }, g);
    },
    powerautomate(g) {
      rrect(g, -13, -13, 26, 26, 7, "#0B53CE");
      el("path", { d: "M -5.5 -6 L -5.5 3 A 5.5 5.5 0 0 0 5.5 3 L 5.5 -1", fill: "none", stroke: "#fff",
        "stroke-width": 2.6, "stroke-linecap": "round" }, g);
      el("polygon", { points: "5.5,-5 9,0.4 2,0.4", fill: "#fff" }, g);
    },
    powerbi(g) {
      [[-9, 12], [-1.5, 18], [6, 24]].forEach(([x, hh]) => rrect(g, x, 12 - hh, 6, hh, 1.6, "#E3A200"));
    },
    copilot(g) {
      el("path", { d: "M0 -13 C 3 -4 4 -3 13 0 C 4 3 3 4 0 13 C -3 4 -4 3 -13 0 C -4 -3 -3 -4 0 -13 Z",
        fill: "#7A5CD6" }, g);
      el("circle", { cx: 0, cy: 0, r: 3, fill: "#fff" }, g);
    },
    powerpages(g) {
      el("circle", { cx: 0, cy: 0, r: 12.5, fill: "#0E7C8B" }, g);
      el("ellipse", { cx: 0, cy: 0, rx: 5.4, ry: 12.5, fill: "none", stroke: "#CFEAEE", "stroke-width": 1.6 }, g);
      el("line", { x1: -12.5, y1: 0, x2: 12.5, y2: 0, stroke: "#CFEAEE", "stroke-width": 1.6 }, g);
    },
    sharepoint(g) {
      rrect(g, -13, -13, 26, 26, 7, "#036C70");
      el("circle", { cx: -2.5, cy: 0, r: 6, fill: "none", stroke: "#fff", "stroke-width": 2.4 }, g);
      el("circle", { cx: 4.5, cy: 0, r: 4, fill: "none", stroke: "#9FE0DE", "stroke-width": 2.2 }, g);
    },
    teams(g) {
      rrect(g, -13, -13, 26, 26, 7, "#5B5FC7");
      el("rect", { x: -8, y: -6.5, width: 16, height: 3.2, rx: 1, fill: "#fff" }, g);
      el("rect", { x: -1.6, y: -6.5, width: 3.2, height: 15, rx: 1, fill: "#fff" }, g);
      el("circle", { cx: 7, cy: -3, r: 3, fill: "#CFD0F0" }, g);
    },
    outlook(g) {
      rrect(g, -13, -13, 26, 26, 7, "#0F6CBD");
      el("rect", { x: -8, y: -5.5, width: 16, height: 11, rx: 1.6, fill: "#fff" }, g);
      el("polyline", { points: "-7,-4 0,2 7,-4", fill: "none", stroke: "#0F6CBD", "stroke-width": 1.8 }, g);
    },
    dynamics(g) {
      rrect(g, -13, -13, 26, 26, 7, "#0B53CE");
      el("path", { d: "M -6 -7 L 5 -7 A 4 4 0 0 1 5 1 L -1 1 L -1 8", fill: "none", stroke: "#fff",
        "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    },
    azure(g) {
      el("polygon", { points: "-1,-12 5,-12 13,11 -6,11", fill: "#0078D4" }, g);
      el("polygon", { points: "-1,-12 3,-2 -7,7 -13,11 -3,11", fill: "#3AA0E8" }, g);
    },
  };

  /* Draw a product mark centred at (0,0) within a `half`-radius box.
     Uses a real inlined icon from window.ICONS[id] when available,
     otherwise the built-in drawn mark above. */
  function drawMark(parent, id, half) {
    const ic = (window.ICONS || {})[id];
    if (ic) {
      const im = el("image", { x: -half, y: -half, width: half * 2, height: half * 2,
        preserveAspectRatio: "xMidYMid meet" }, parent);
      im.setAttribute("href", ic);
      im.setAttributeNS("http://www.w3.org/1999/xlink", "href", ic);
      return;
    }
    if (M[id]) M[id](el("g", { transform: `scale(${(half / 14).toFixed(3)})` }, parent));
  }

  /* =====================================================================
   *  Build the scene
   * =================================================================== */
  const svg = $("#scene");
  const Lground = $("#Lground"), Lbeams = $("#Lbeams"), Lparts = $("#Lparts"),
        Lnodes = $("#Lnodes"), Llabels = $("#Llabels");
  const nodes = {};   // id -> node
  const beams = [];
  let selectedId = null;   // persists across orbit rebuilds
  let focusClient = null;  // which client tenant is spotlighted
  let sceneFirst = true;   // first build plays the rise animation; rebuilds don't

  /* ---- capability catalogue + per-client island layout ---- */
  const capById = {};
  D.buildings.forEach((b) => (capById[b.id] = b));
  const CL = {};   // clientId -> { client, corePos, ring:[{capId,pos,h,size,flagship}], box:[gxm,gym,gxM,gyM] }
  function computeLayout() {
    for (const k in CL) delete CL[k];
    D.clients.forEach((c) => {
      const cx = c.center[0], cy = c.center[1], n = c.runs.length, R = 2.25;
      const ring = c.runs.map((capId, i) => {
        const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
        const cap = capById[capId] || {};
        const isFlag = capId === c.flagship;
        return { capId, pos: [cx + Math.cos(a) * R, cy + Math.sin(a) * R],
          h: 1.35 * (isFlag ? 1.3 : 1) + (i % 3) * 0.12, size: 1.12, flagship: isFlag };
      });
      let gxm = cx, gxM = cx, gym = cy, gyM = cy;
      const consider = (p, s) => { gxm = Math.min(gxm, p[0] - s); gxM = Math.max(gxM, p[0] + s); gym = Math.min(gym, p[1] - s); gyM = Math.max(gyM, p[1] + s); };
      consider(c.center, 1.0);
      ring.forEach((b) => consider(b.pos, b.size * 0.6 + 0.35));
      const pad = 0.75; gxm -= pad; gxM += pad; gym -= pad; gyM += pad;
      CL[c.id] = { client: c, corePos: c.center.slice(), coreH: 1.5, coreSize: 1.15, ring, box: [gxm, gym, gxM, gyM] };
    });
  }

  /* ---- per-client island plates (each a separate tenant; no shared plate) ---- */
  function buildGround() {
    const diamond = (gxm, gym, gxM, gyM) => [iso(gxm, gym, 0), iso(gxM, gym, 0), iso(gxM, gyM, 0), iso(gxm, gyM, 0)];
    D.clients.forEach((c) => {
      const L2 = CL[c.id]; const [gxm, gym, gxM, gyM] = L2.box;
      const top = diamond(gxm, gym, gxM, gyM);
      const thPx = 12;
      // soft shadow so each tenant island reads as floating apart
      const scx = (top[0][0] + top[2][0]) / 2;
      const sbot = Math.max(top[0][1], top[1][1], top[2][1], top[3][1]);
      el("ellipse", { cx: scx.toFixed(1), cy: (sbot + 6).toFixed(1), rx: (Math.abs(top[1][0] - top[3][0]) / 2 * 0.82).toFixed(1),
        ry: 16, fill: "#1E2D46", opacity: 0.10, filter: "url(#soft)" }, Lground);
      poly(Lground, top.map((p) => [p[0], p[1] + thPx]), shade(c.color, -0.30));  // tenant wall (thickness)
      poly(Lground, top, "#EEF3FA", { stroke: c.color, "stroke-width": 2, opacity: 1 });
      // faint client tint + soft inner grid
      poly(Lground, top, c.color + "0F");
      for (let gx = Math.ceil(gxm); gx <= Math.floor(gxM); gx++) {
        const a = iso(gx, gym, 0), b = iso(gx, gyM, 0);
        el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: c.color, "stroke-width": 0.6, opacity: 0.10 }, Lground);
      }
      for (let gy = Math.ceil(gym); gy <= Math.floor(gyM); gy++) {
        const a = iso(gxm, gy, 0), b = iso(gxM, gy, 0);
        el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: c.color, "stroke-width": 0.6, opacity: 0.10 }, Lground);
      }
      // island caption at the front edge: name · sector · isolated tenant
      const lp = iso((gxm + gxM) / 2, gyM - 0.2, 0);
      const cap = el("g", { transform: `translate(${lp[0].toFixed(1)},${(lp[1] + 14).toFixed(1)})` }, Lground);
      const nm = el("text", { x: 0, y: 0, "text-anchor": "middle", fill: "#22324C", "font-size": 14, "font-weight": 800,
        stroke: "#EEF3FA", "stroke-width": 3, "paint-order": "stroke", "font-family": "Segoe UI, Inter, sans-serif" }, cap);
      nm.textContent = c.name + (c.real ? "" : "  ·  illustrative");
      const sub = el("text", { x: 0, y: 16, "text-anchor": "middle", fill: c.color, "font-size": 11, "font-weight": 700,
        "letter-spacing": ".04em", "font-family": "Segoe UI, Inter, sans-serif" }, cap);
      sub.textContent = "ISOLATED TENANT · " + c.sector.toUpperCase();
      bd(lp[0] - 120, lp[1] + 30); bd(lp[0] + 120, lp[1] + 30);
    });
  }

  /* population dots under a building — density reads as scale */
  function drawPopulation(parent, ground, n, color) {
    const per = 8, gap = 6, r = 2.3, rows = Math.ceil(n / per);
    let drawn = 0; const y0 = ground[1] + 7;
    for (let row = 0; row < rows; row++) {
      const inRow = Math.min(per, n - drawn), w = (inRow - 1) * gap;
      for (let i = 0; i < inRow; i++)
        el("circle", { cx: (ground[0] - w / 2 + i * gap).toFixed(1), cy: (y0 + row * gap).toFixed(1),
          r, fill: color, opacity: 0.92, stroke: "#fff", "stroke-width": 0.6 }, parent);
      drawn += inRow;
    }
    bd(ground[0] - 28, y0 + rows * gap + 2);
    return 7 + rows * gap + 8;
  }

  function nodeShell(id, ariaLabel) {
    return el("g", { class: sceneFirst ? "node" : "node in", "data-id": id, tabindex: "0", role: "button", "aria-label": ariaLabel }, Lnodes);
  }
  function wireNode(node) {
    const g = node.g;
    g.addEventListener("pointerenter", () => onHover(node, true));
    g.addEventListener("pointerleave", () => onHover(node, false));
    g.addEventListener("click", (e) => { if (!dragMoved) { e.stopPropagation(); selectNode(node); } });
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectNode(node); } });
  }

  /* each client's OWN Dataverse core (a glowing cylinder at the island centre) */
  function drawCore(client, pos) {
    const id = "core:" + client.id;
    const g = nodeShell(id, client.name + " — isolated Dataverse tenant");
    const color = client.color, glow = glowFor(color);
    const geo = dbTower(g, pos[0], pos[1], 1.15, 1.6, color, glow);
    // Dataverse mark on a disc above the core
    const a = geo.top, mg = el("g", { transform: `translate(${a[0].toFixed(1)},${(a[1] - 26).toFixed(1)})` }, g);
    el("circle", { cx: 0, cy: 0, r: 17, fill: "#fff", stroke: "#E4ECF6", "stroke-width": 1.5, filter: "url(#soft)" }, mg);
    L.svg(mg, "dataverse", 12);
    bd(a[0] - 20, a[1] - 46);
    const lp = geo.ground;
    const lbl = el("text", { x: lp[0].toFixed(1), y: (lp[1] + 22).toFixed(1), "text-anchor": "middle", fill: "#3A4A66",
      "font-size": 11.5, "font-weight": 700, stroke: "#EEF3FA", "stroke-width": 3, "paint-order": "stroke",
      "font-family": "Segoe UI, Inter, sans-serif" }, Llabels);
    lbl.textContent = "Dataverse";
    const node = { id, kind: "core", clientId: client.id, client, g, labelEl: lbl, top: geo.top, ground: geo.ground, pulse: null };
    nodes[id] = node; wireNode(node); return node;
  }

  /* one deployed solution building inside a client's island */
  function drawBuilding(client, item) {
    const cap = capById[item.capId]; if (!cap) return null;
    const id = client.id + ":" + item.capId;
    const g = nodeShell(id, cap.name + " — deployed for " + client.name);
    const color = client.color, glow = glowFor(color);
    const units = Math.max(3, Math.round(item.h / 0.42));
    const geo = serverTower(g, item.pos[0], item.pos[1], item.size, item.size, item.h, color, glow, units);
    const key = (cap.microsoftProducts || [])[0];
    if (key) {
      const a = geo.top, mg = el("g", { transform: `translate(${a[0].toFixed(1)},${(a[1] - 28).toFixed(1)})` }, g);
      el("circle", { cx: 0, cy: 0, r: 18, fill: "#fff", stroke: "#E4ECF6", "stroke-width": 1.5, filter: "url(#soft)" }, mg);
      L.svg(mg, key, 12.5);
      bd(a[0] - 22, a[1] - 50);
    }
    let pulse = null;
    if (item.flagship) { const a = geo.top; pulse = el("circle", { cx: a[0], cy: a[1] - 2, r: 20, fill: "none", stroke: color, "stroke-width": 2, opacity: 0.5 }, g); }
    let drop = 24;
    if (cap.pod && cap.pod.headcount) drop = drawPopulation(g, geo.ground, cap.pod.headcount, color) + 8;
    const lp = geo.ground;
    const lbl = el("text", { x: lp[0].toFixed(1), y: (lp[1] + drop).toFixed(1), "text-anchor": "middle", fill: "#2A3A57",
      "font-size": 12, "font-weight": item.flagship ? 800 : 700, stroke: "#FFFFFF", "stroke-width": 3.4,
      "paint-order": "stroke", "stroke-linejoin": "round", "font-family": "Segoe UI, Inter, sans-serif" }, Llabels);
    lbl.textContent = cap.name;
    bd(lp[0] - 70, lp[1] + drop + 8); bd(lp[0] + 70, lp[1] + drop + 8);
    const node = { id, kind: "building", clientId: client.id, client, cap, g, labelEl: lbl, top: geo.top, ground: geo.ground, pulse, flagship: !!item.flagship };
    nodes[id] = node; wireNode(node); return node;

  function buildNodes() {
    const list = [];

      const L2 = CL[c.id];
      list.push({ depth: depthOf(L2.corePos), draw: () => drawCore(c, L2.corePos) });
      L2.ring.forEach((it) => list.push({ depth: depthOf(it.pos), draw: () => drawBuilding(c, it) }));

  /* ---- beams: WITHIN a client only (its Dataverse to its solutions). Never
         between clients — the whole point is that tenants don't touch. ---- */
  function addBeam(aId, bId, color, o) {
    o = o || {};
    const a = nodes[aId], b = nodes[bId]; if (!a || !b) return;
    const p0 = a.top, p1 = b.top;
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
    const dist = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
    const cy = my - (dist * 0.30 + 40);
    const d = `M ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} Q ${mx.toFixed(1)} ${cy.toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
    const grp = el("g", { class: "beam" }, Lbeams);
    const path = el("path", { d, fill: "none", stroke: color, "stroke-width": o.w || 1.8, "stroke-linecap": "round", opacity: o.op || 0.36 }, grp);
    bd(mx, cy);
    const pg = el("g", { class: "beam" }, Lparts);
    const dots = [];
    const n = REDUCED ? 0 : (o.n || 1);
    for (let i = 0; i < n; i++) dots.push({ c: el("circle", { r: o.r || 2.4, fill: color, opacity: 0.95 }, pg), t: i / n });
    beams.push({ grp, pg, path, dots, len: 0, aId, bId, clientId: o.clientId, speed: 0.10 + Math.random() * 0.06 });
  }

  function countUp(elm, to, suffix) {
    const s = String(to), dot = s.indexOf("."), dec = dot < 0 ? 0 : s.length - dot - 1;
    const fmt = (v) => { const neg = v < 0; return (neg ? "-" : "") +
      Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }); };
    const render = (v) => { elm.innerHTML = fmt(v) + '<span class="s">' + suffix + "</span>"; };
    if (REDUCED) { render(to); return; }
    const dur = 850, t0 = performance.now();
    (function step(now) {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      render(to * e); if (t < 1) requestAnimationFrame(step); else render(to);
    })(performance.now());
  }

  /* =====================================================================
   *  Camera: viewBox pan + zoom
   * =================================================================== */
  let VB = { x: 0, y: 0, w: 100, h: 100 }, fit = null;
  function applyVB() { svg.setAttribute("viewBox", `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`); }
  function computeFit() {
    const cxc = (minX + maxX) / 2, cyc = (minY + maxY) / 2;
    // pad generously so the scene never clips as it orbits (extent grows ~diagonally)
    const w = (maxX - minX) * 1.24 + 150, h = (maxY - minY) * 1.24 + 150;
    const r = svg.getBoundingClientRect();
    const aspect = r.width / r.height || 1.6;
    let W = w, H = h;
    if (W / H > aspect) H = W / aspect; else W = H * aspect;
    fit = { x: cxc - W / 2, y: cyc - H / 2, w: W, h: H };
    VB = Object.assign({}, fit); applyVB();
  }

  // rebuild the whole scene at the current yaw (used when orbiting)
  function buildScene(first) {
    sceneFirst = !!first;
    [Lground, Lbeams, Lparts, Lnodes, Llabels].forEach((g) => g.replaceChildren());
    minX = 1e9; minY = 1e9; maxX = -1e9; maxY = -1e9;
    for (const k in nodes) delete nodes[k];
    beams.length = 0;
    computeLayout();
    buildGround();
    buildNodes();
    buildBeams();
    applyFocusStates();
  }
  let rebuildQueued = false;
  function queueRebuild() {
    if (rebuildQueued) return;
    rebuildQueued = true;
    requestAnimationFrame(() => { rebuildQueued = false; buildScene(false); });
  }

  // zoom the viewBox toward a client point by factor k (k<1 zooms in)
  function zoomAt(clientX, clientY, k) {
    const r = svg.getBoundingClientRect();
    const mx = VB.x + (clientX - r.left) / r.width * VB.w;
    const my = VB.y + (clientY - r.top) / r.height * VB.h;
    const nw = Math.min(fit.w * 2.4, Math.max(fit.w * 0.4, VB.w * k));
    const f = nw / VB.w;
    VB.w = nw; VB.h *= f;
    VB.x = mx - (mx - VB.x) * f; VB.y = my - (my - VB.y) * f;
    applyVB();
  }

  function panBy(dx, dy) {
    const r = svg.getBoundingClientRect();
    VB.x -= dx * VB.w / r.width; VB.y -= dy * VB.h / r.height; applyVB();
  }
  const pts = new Map();               // active pointers → {x,y}
  let dragging = false, dragMoved = false, captured = false, dsx = 0, dsy = 0, pid = null, mode = "orbit";
  let pinchDist = 0;
  svg.addEventListener("contextmenu", (e) => e.preventDefault());   // right-drag pans
  svg.addEventListener("pointerdown", (e) => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      dragging = true; dragMoved = false; captured = false; pid = e.pointerId;
      dsx = e.clientX; dsy = e.clientY;
      // left = orbit; right / middle / Shift / Ctrl = pan (move freely)
      mode = (e.button === 2 || e.button === 1 || e.shiftKey || e.ctrlKey) ? "pan" : "orbit";
    } else if (pts.size === 2) {
      dragging = false;
      const a = [...pts.values()]; pinchDist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;
      tag.classList.remove("show");
    }
  });
  svg.addEventListener("pointermove", (e) => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size >= 2) {                // pinch-zoom
      const a = [...pts.values()], d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1;

      // back to the scene centre — pin that ground point in place as we spin.
      const sp = scenePoint(e.clientX, e.clientY);      // scene coords under cursor
      const piv = unproject(sp[0], sp[1]);              // tile it maps to (old yaw)
      setYaw(yaw - dx * 0.006); setPitch(pitch - dy * 0.0016);
      const np = iso(piv.x, piv.y, 0);                  // where that tile lands now
      VB.x += np[0] - sp[0]; VB.y += np[1] - sp[1];     // shift so it stays put
      applyVB(); queueRebuild();
    }

  });

  // click empty space: focus the island under the cursor, else back to all
  function scenePoint(cx, cy) { const r = svg.getBoundingClientRect(); return [VB.x + (cx - r.left) / r.width * VB.w, VB.y + (cy - r.top) / r.height * VB.h]; }
  function pointInPoly(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;

  }
  function islandAt(px, py) {
    for (const c of D.clients) {
      const [gxm, gym, gxM, gyM] = CL[c.id].box;
      if (pointInPoly(px, py, [iso(gxm, gym, 0), iso(gxM, gym, 0), iso(gxM, gyM, 0), iso(gxm, gyM, 0)])) return c.id;
    }

  }
  svg.addEventListener("click", (e) => {
    if (e.target !== svg || dragMoved) return;

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();

    const mx = VB.x + (e.clientX - r.left) / r.width * VB.w;
    const my = VB.y + (e.clientY - r.top) / r.height * VB.h;
    const f = e.deltaY > 0 ? 1.1 : 0.9;
    const nw = Math.min(fit.w * 2.4, Math.max(fit.w * 0.35, VB.w * f));
    const k = nw / VB.w;

  addEventListener("keydown", (e) => {

    else if (e.key === "ArrowRight") { VB.x += step; applyVB(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { VB.y -= step; applyVB(); e.preventDefault(); }

  /* =====================================================================
   *  Particle animation
   * =================================================================== */
  let last = performance.now();
  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (REDUCED) return;
    for (const bm of beams) {
      if (!bm.len) { try { bm.len = bm.path.getTotalLength(); } catch (_) { continue; } }
      for (const dp of bm.dots) {
        dp.t += bm.speed * dt * 4 / (bm.len / 120);
        if (dp.t > 1) dp.t -= 1;
        try { const pt = bm.path.getPointAtLength(dp.t * bm.len);
          dp.c.setAttribute("cx", pt.x.toFixed(1)); dp.c.setAttribute("cy", pt.y.toFixed(1)); } catch (_) {}
      }
    }
    // ambient: a soft pulse on the flagship, a slow glow on landmark beacons
    const ts = now / 1000;
    for (const id in nodes) {
      const n = nodes[id];
      if (n.pulse) {
        const s = Math.sin(ts * 1.5);
        n.pulse.setAttribute("r", (21 + s * 6).toFixed(1));
        n.pulse.setAttribute("opacity", (0.28 + 0.22 * (0.5 + 0.5 * s)).toFixed(2));
      }
      if (n.beacon) n.beacon.setAttribute("opacity", (0.4 + 0.32 * (0.5 + 0.5 * Math.sin(ts * 2.1))).toFixed(2));
    }
  }

      tiles.innerHTML = '<span class="cap">Clients · separate tenants</span>';
      const row = el2("div", "ctiles");
      const all = el2("button", "ctile all on"); all.textContent = "All"; all.setAttribute("data-client", "");
      all.addEventListener("click", showAllClients); row.appendChild(all);
      D.clients.forEach((c) => {
        const t = el2("button", "ctile"); t.setAttribute("data-client", c.id);
        t.innerHTML = '<span class="dot" style="background:' + c.color + '"></span>' + c.short + (c.real ? "" : "*");
        t.addEventListener("click", () => focusClientTile(c.id));
        row.appendChild(t);
      });
      tiles.appendChild(row);
    }
  }

  function setActiveTile(clientId) {
    document.querySelectorAll(".ctile").forEach((t) => t.classList.toggle("on", t.getAttribute("data-client") === (clientId || "")));
  }
  function islandCentreScreen(clientId) {
    const [gxm, gym, gxM, gyM] = CL[clientId].box;
    return iso((gxm + gxM) / 2, (gym + gyM) / 2, 0.8);
  }
  function focusClientTile(clientId) {
    focusClient = clientId; selectedId = null;
    markExplored({ clientId });
    applyFocusStates();
    setActiveTile(clientId);
    fillClientPanel(CL[clientId].client);
    const p = $("#panel"); p.classList.add("open"); p.scrollTop = 0;
    const c = islandCentreScreen(clientId); tweenVBCenter(c[0], c[1] - 30, 650);
  }
  function showAllClients() {
    focusClient = null; selectedId = null;
    applyFocusStates();
    setActiveTile(null);
    $("#panel").classList.remove("open");
    tweenVBCenter(fit.x + fit.w / 2, fit.y + fit.h / 2, 650);
  }

  /* ---- intro / reveal ---- */
  function reveal() {
    ["#brand", "#ms-corner", "#clients", "#hint", "#reset", "#counter", "#footer"].forEach((s) => { const e = $(s); if (e) e.classList.add("in"); });
    // stagger buildings rising, back-to-front
    const arr = Object.values(nodes).sort((a, b) => a.order - b.order);
    arr.forEach((n, i) => setTimeout(() => n.g.classList.add("in"), REDUCED ? 0 : 120 + i * 40));
  }
  function enterScene() {
    const intro = $("#intro"); intro.classList.add("gone");
    setTimeout(() => (intro.style.display = "none"), 800);
    if (!REDUCED) { // little zoom-in
      const start = { x: fit.x - fit.w * 0.08, y: fit.y - fit.h * 0.08, w: fit.w * 1.16, h: fit.h * 1.16 };
      VB = Object.assign({}, start); applyVB();
      const t0 = performance.now(), dur = 1100;
      (function z(now) {
        const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
        VB = { x: start.x + (fit.x - start.x) * e, y: start.y + (fit.y - start.y) * e,
          w: start.w + (fit.w - start.w) * e, h: start.h + (fit.h - start.h) * e };
        applyVB(); if (t < 1) requestAnimationFrame(z);
      })(t0);
    }
    reveal();
  }

  /* =====================================================================
   *  Boot
   * =================================================================== */
  function boot() {
    buildScene(true);
    buildChrome();
    computeFit();
    requestAnimationFrame(tick);

    $("#enter").addEventListener("click", enterScene);
    $("#panel .p-close").addEventListener("click", clearFocus);
    $("#reset").addEventListener("click", () => {   // back to all clients, level view
      focusClient = null; selectedId = null; setActiveTile(null);
      $("#panel").classList.remove("open");
      setYaw(0); setPitch(0.5); buildScene(false);
      VB = Object.assign({}, fit); applyVB();
    });
    addEventListener("keydown", (e) => { if (e.key === "Escape") clearFocus(); });
    addEventListener("resize", () => computeFit());

    // small API (also used by automated checks)
    window.Landscape = { select: (id) => nodes[id] && selectNode(nodes[id]), reset: clearFocus,
      enter: enterScene, ids: () => Object.keys(nodes), client: focusClientTile, allClients: showAllClients };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body></html>
