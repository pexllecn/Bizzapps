<script>
/* ==========================================================================
 *  Showcase page runtime - hero, platform stack, city gateway, sections.
 * ========================================================================== */
(function () {
  "use strict";

  var D = window.BIZ, ICONS = window.ICONS || {};
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(t, c, h) { var n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function icon(k) { return ICONS[k] || ""; }
  function ini(n) { return n.split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase(); }

  var stage = null;

  /* ------------------------------------------------------------ 1 · brand */
  function brand() {
    var ey = icon("ey");
    if (ey) { $("#eyMark").src = ey; $("#footEy").src = ey; }
    var ms = icon("microsoft");
    if (ms) $("#footMs").src = ms;
  }

  /* ------------------------------------------------------------- 2 · hero */
  function hero() {
    var h = D.hero;
    $("#hEyebrow").textContent = h.eyebrow;
    $("#hTitle").innerHTML = esc(h.line1) + "<br>" + esc(h.line2) + ' <span class="rot">' +
      h.rotator.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + "</span>";
    $("#hSub").textContent = h.sub;
    var w = $("#hStats");
    h.stats.forEach(function (s) {
      w.appendChild(el("div", "st",
        '<div class="n"><b class="num" data-to="' + s.n + '">0</b><i>' + esc(s.s) + "</i></div>" +
        '<div class="l">' + esc(s.l) + '</div><div class="s">' + esc(s.sub) + "</div>"));
    });
    countUp(w);
  }
  function countUp(scope) {
    $$(".num", scope).forEach(function (n) {
      var to = +n.dataset.to, t0 = null;
      if (REDUCED) { n.textContent = to.toLocaleString("en-IE"); return; }
      requestAnimationFrame(function step(t) {
        if (!t0) t0 = t;
        var p = Math.min(1, (t - t0) / 1800);
        n.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString("en-IE");
        if (p < 1) requestAnimationFrame(step);
      });
    });
  }

  /* --------------------------------------------------- 3 · particle field */
  function field() {
    var cvs = $("#fieldCanvas"); if (!cvs) return;
    var ctx = cvs.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var pts = [], W = 0, H = 0, mx = -999, my = -999, raf = null;
    function size() {
      var r = cvs.getBoundingClientRect();
      W = r.width; H = r.height;
      cvs.width = W * dpr; cvs.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.min(120, Math.round(W * H / 13000));
      pts = [];
      for (var i = 0; i < n; i++) pts.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18,
        r: Math.random() * 1.5 + .5, hot: Math.random() < .18,
      });
    }
    function frame() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        for (var j = i + 1; j < pts.length; j++) {
          var q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
          if (d2 < 17000) {
            ctx.strokeStyle = "rgba(255,255,255," + ((1 - d2 / 17000) * .16).toFixed(3) + ")";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
          }
        }
        var ddx = p.x - mx, ddy = p.y - my, near = (ddx * ddx + ddy * ddy) < 30000;
        ctx.fillStyle = (p.hot || near) ? "rgba(255,230,0,.85)" : "rgba(255,255,255,.34)";
        ctx.beginPath(); ctx.arc(p.x, p.y, near ? p.r * 1.9 : p.r, 0, 6.284); ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }
    size();
    window.addEventListener("resize", size);
    cvs.parentElement.addEventListener("pointermove", function (e) {
      var r = cvs.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top;
    });
    cvs.parentElement.addEventListener("pointerleave", function () { mx = my = -999; });
    if (!REDUCED) {
      frame();
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (es) {
          es.forEach(function (en) {
            if (en.isIntersecting) { if (!raf) raf = requestAnimationFrame(frame); }
            else { cancelAnimationFrame(raf); raf = null; }
          });
        }, { threshold: 0 }).observe(cvs);
      }
    }
  }

  /* -------------------------------------------------------- 4 · 3D stack */
  function buildStack() {
    var s = D.stack;
    $("#stKicker").textContent = s.kicker;
    $("#stTitle").textContent = s.title;
    $("#stLede").textContent = s.lede;
    $("#stHint").textContent = s.hint;

    var host = $("#stage"), keys = $("#keys"), cap = $("#stCap");

    s.layers.forEach(function (L) {
      var b = el("button", "");
      b.style.setProperty("--c", L.color);
      b.dataset.id = L.id;
      b.innerHTML = '<span class="sw"></span>' + esc(L.name);
      b.addEventListener("click", function () { setFocus(L.id); });
      keys.appendChild(b);
    });

    try { stage = new window.BizStack(host, s.layers, D.products, ICONS); }
    catch (e) { stage = null; }

    if (!stage || stage.failed) { fallback(host); return; }

    var lbl = el("div", "lbl");
    $("#labels").appendChild(lbl);
    stage.onHover = function (n) {
      if (!n) { lbl.classList.remove("show"); return; }
      var p = D.products[n.pid];
      lbl.textContent = p ? p.name : n.pid;
      lbl.classList.add("show");
    };
    stage.onFrame = function () {
      var n = stage.hover;
      if (n && n.scr) { lbl.style.left = n.scr.x + "px"; lbl.style.top = (n.scr.y - n.scr.r - 26) + "px"; }
    };
    stage.onSelect = function (pid) { openDrawer(pid); };

    function setFocus(id) {
      var now = stage.setFocus(id);
      $$("#keys button").forEach(function (b) { b.classList.toggle("on", b.dataset.id === now); });
      var L = s.layers.filter(function (x) { return x.id === now; })[0];
      if (L) { cap.style.setProperty("--c", L.color); cap.textContent = L.caption; cap.classList.add("show"); }
      else cap.classList.remove("show");
    }
    window.__focus = setFocus;

    $("#tExplode").addEventListener("click", function () {
      var on = !stage.exploded;
      stage.setExplode(on);
      this.classList.toggle("on", on);
      this.textContent = on ? "Collapse" : "Pull apart";
    });
    $("#tSpin").classList.toggle("on", stage.spinning);
    $("#tSpin").addEventListener("click", function () {
      var on = !stage.spinning;
      stage.setSpin(on);
      this.classList.toggle("on", on);
    });
    $("#tReset").addEventListener("click", function () {
      stage.resetView();
      if (stage.focus) setFocus(stage.focus);
    });
    if (REDUCED) { stage.setSpin(false); $("#tSpin").classList.remove("on"); }
  }

  /* Content survives with no WebGL: render the stack as HTML instead. */
  function fallback(host) {
    host.style.height = "auto"; host.style.cursor = "default";
    var box = el("div", "gl-fb");
    D.stack.layers.forEach(function (L) {
      var r = el("div", "r");
      r.style.setProperty("--c", L.color);
      r.innerHTML = "<h4>" + esc(L.index) + " · " + esc(L.name) + "</h4><p>" + esc(L.caption) + '</p><div class="ps"></div>';
      var ps = $(".ps", r);
      L.products.forEach(function (pid) {
        var p = D.products[pid]; if (!p) return;
        var b = el("span", "", esc(p.name));
        b.addEventListener("click", function () { openDrawer(pid); });
        ps.appendChild(b);
      });
      box.appendChild(r);
    });
    host.appendChild(box);
    $(".hint").style.display = "none";
    $(".tools").style.display = "none";
  }

  /* --------------------------------------------------- 5 · product drawer */
  function openDrawer(pid) {
    var p = D.products[pid]; if (!p) return;
    if (stage && !stage.failed) stage.select(pid);
    $("#dImg").src = icon(pid);
    $("#dFam").textContent = p.family;
    $("#dName").textContent = p.name;
    var body = $("#dBody");
    body.innerHTML = "";
    body.appendChild(el("div", "dsec", "<h4>What it is</h4><p>" + esc(p.what) + "</p>"));
    body.appendChild(el("div", "dsec hl", "<h4>What EY does with it</h4><p>" + esc(p.ey) + "</p>"));

    var layer = D.stack.layers.filter(function (L) { return L.products.indexOf(pid) >= 0; })[0];
    if (layer) {
      body.appendChild(el("div", "dsec",
        "<h4>Sits in</h4><p>" + esc(layer.index + " · " + layer.name) + " - " + esc(layer.caption) + "</p>"));
    }
    if (p.proof && p.proof.length) {
      var sec = el("div", "dsec", "<h4>In production at</h4>");
      var chips = el("div", "pchips");
      p.proof.forEach(function (cid) {
        var c = D.city.clients.filter(function (x) { return x.id === cid; })[0];
        if (!c) return;
        var a = el("a", "", esc(c.name) + " &rarr;");
        a.href = "city.html?c=" + encodeURIComponent(cid);
        chips.appendChild(a);
      });
      sec.appendChild(chips);
      body.appendChild(sec);
    }
    $("#drawer").classList.add("open");
    $("#drawer").setAttribute("aria-hidden", "false");
    $("#scrim").classList.add("on");
  }
  function closeDrawer() {
    $("#drawer").classList.remove("open");
    $("#drawer").setAttribute("aria-hidden", "true");
    $("#scrim").classList.remove("on");
    if (stage && !stage.failed) stage.select(null);
  }

  /* ------------------------------------------------------ 6 · city gate */
  function gate() {
    var c = D.city;
    $("#gKicker").textContent = "The city";
    $("#gTitle").innerHTML = esc(c.title) + " <em>" + esc(c.titleAccent) + "</em>";
    $("#gLede").textContent = c.lede;
    var gs = $("#gStats");
    c.stats.forEach(function (s) {
      gs.appendChild(el("div", "", '<div class="v">' + esc(s.v) + '</div><div class="l">' + esc(s.l) + "</div>"));
    });
    var gm = $("#gMarks");
    ["power-platform","power-apps","power-automate","power-bi","power-pages","dataverse",
     "dynamics365","copilot","azure","fabric","purview"].forEach(function (k) {
      if (!icon(k)) return;
      var im = el("img"); im.src = icon(k); im.alt = ""; gm.appendChild(im);
    });
    gateSkyline();
  }

  /* A live preview of the actual city behind the gateway, rendered with the
     same engine the city page uses. The previous version drew a row of
     cartoon elevations from a separate 1,200 line 2D landmark library that
     existed in this page for no other reason - and it previewed a city that
     no longer looks like that. */
  function gateSkyline() {
    var cvs = $("#gateCanvas");
    if (!cvs || !window.EYGL || !window.EYCITY) return;

    var R = new window.EYGL.Renderer(cvs);
    if (R.failed) { cvs.style.display = "none"; return; }

    var S = window.EYCITY.build(D);
    R.upload(S.builder);
    R.cam.el = 0.34;
    R.cam.az = -0.9;
    R.cam.dist = S.LIMIT * 1.34 / Math.tan(R.cam.fov / 2) * 0.62;
    R.cam.tgt = [0, 0, 7];
    R.cam.azT = R.cam.az; R.cam.elT = R.cam.el;
    R.cam.distT = R.cam.dist; R.cam.tgtT = R.cam.tgt.slice();

    var raf = null, shadowR = S.radius * 1.5;
    function frame() {
      if (!REDUCED) R.cam.az = R.cam.azT = R.cam.az + 0.00035;
      R.resize();
      R.draw(shadowR);
      raf = requestAnimationFrame(frame);
    }
    function start() { if (!raf) raf = requestAnimationFrame(frame); }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

    R.resize(); R.draw(shadowR);
    if (REDUCED) return;
    /* only render while it is actually on screen, and never in a hidden tab */
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (es) {
        es.forEach(function (e) { e.isIntersecting && !document.hidden ? start() : stop(); });
      }, { threshold: 0 }).observe(cvs);
    } else start();
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop();
      else if (cvs.getBoundingClientRect().top < innerHeight) start();
    });
  }

  /* ----------------------------------------------------- 7 · other blocks */
  function capability() {
    var c = D.capability;
    $("#capKicker").textContent = c.kicker;
    $("#capTitle").textContent = c.title;
    var g = $("#capCols");
    c.columns.forEach(function (col) {
      var n = el("div", "col");
      n.style.setProperty("--c", col.tone);
      n.innerHTML = "<h3>" + esc(col.title) + "</h3><ul>" +
        col.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>";
      g.appendChild(n);
    });
  }

  function offerings() {
    var o = D.offerings;
    $("#ofKicker").textContent = o.kicker;
    $("#ofTitle").textContent = o.title;
    var g = $("#ofGrid");
    o.items.forEach(function (it) {
      var n = el("div", "off");
      n.style.setProperty("--c", it.tone);
      n.innerHTML =
        '<div class="ic"><img alt="" src="' + icon(it.icon) + '"></div>' +
        "<h3>" + esc(it.name) + "</h3><p>" + esc(it.body) + "</p>" +
        '<div class="foot"><div class="who">' + esc(it.contact) +
        '<a href="mailto:' + esc(it.email) + '">' + esc(it.email) + "</a></div>" +
        '<a class="jump" href="city.html?c=' + encodeURIComponent(it.client) + '">See it in the city &rarr;</a></div>';
      g.appendChild(n);
    });
  }

  function scale() {
    var s = D.scale;
    $("#scKicker").textContent = s.kicker;
    $("#scTitle").textContent = s.title;
    var m = $("#scMst");
    s.milestones.forEach(function (x) {
      m.appendChild(el("div", "leaf", '<div class="v">' + esc(x.v) + '</div><div class="l">' + esc(x.l) + "</div>"));
    });
    var w = $("#scWhy");
    s.why.forEach(function (x) { w.appendChild(el("div", "c", "<h4>" + esc(x.t) + "</h4><p>" + esc(x.b) + "</p>")); });
    $("#clTitle").textContent = s.clients.title;
    var c = $("#clGrid");
    s.clients.groups.forEach(function (grp) {
      c.appendChild(el("div", "", "<h4>" + esc(grp.sector) + '</h4><div class="chips logos">' +
        grp.names.map(function (x) {
          /* tolerate the old string form as well as the {n, logo} object */
          var nm = typeof x === "string" ? x : x.n;
          var lg = typeof x === "string" ? null : x.logo;
          var src = lg && ICONS[lg];
          return '<span class="lgo' + (src ? "" : " txt") + '" title="' + esc(nm) + '">' +
                 (src ? '<img src="' + src + '" alt="' + esc(nm) + '" loading="lazy">'
                      : esc(nm)) + "</span>";
        }).join("") + "</div>"));
    });
  }

  function team() {
    var t = D.team;
    $("#tmKicker").textContent = t.kicker;
    $("#tmTitle").textContent = t.title;
    $("#tmLede").textContent = t.lede;
    var g = $("#tmGrid");
    t.people.forEach(function (p) {
      var a = el("a", "person");
      a.href = "mailto:" + p.email;
      a.style.setProperty("--c", p.tone);
      var av = p.photo
        ? '<div class="av"><img src="' + p.photo + '" alt="' + esc(p.name) + '" loading="lazy"></div>'
        : '<div class="av">' + ini(p.name) + '</div>';
      a.innerHTML = av + '<div class="n">' + esc(p.name) +
        '</div><div class="r">' + esc(p.role) + '</div><div class="t">' + esc(p.title) +
        '</div><div class="e">' + esc(p.email) + "</div>";
      g.appendChild(a);
    });
  }

  function closing() {
    var c = D.close;
    $("#clsKicker").textContent = c.kicker;
    $("#clsTitle").textContent = c.title;
    $("#clsBody").textContent = c.body;
    var cta = $("#clsCta");
    cta.href = "mailto:" + c.email;
    cta.innerHTML = esc(c.cta) + ' <span class="arw">&rarr;</span>';
    $("#footDis").textContent = c.disclaimer;
  }

  function scrollFx() {
    var bar = $("#prog"), top = $("#topbar");
    var links = $$("#nav a").filter(function (a) { return a.getAttribute("href").charAt(0) === "#"; });
    var secs = links.map(function (a) { return document.getElementById(a.getAttribute("href").slice(1)); });
    function onScroll() {
      var y = window.scrollY;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (max > 0 ? (y / max) * 100 : 0) + "%";
      top.classList.toggle("stuck", y > 40);
      var cur = -1;
      secs.forEach(function (s, i) {
        if (s && s.getBoundingClientRect().top <= window.innerHeight * 0.42) cur = i;
      });
      links.forEach(function (a, i) { a.classList.toggle("on", i === cur); });
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { threshold: 0.1, rootMargin: "0px 0px -8% 0px" });
      $$(".rv").forEach(function (n) { io.observe(n); });
    } else $$(".rv").forEach(function (n) { n.classList.add("in"); });
  }

  function init() {
    brand(); hero(); buildStack(); gate();
    capability(); offerings(); scale(); team(); closing();
    field(); scrollFx();

    $("#dClose").addEventListener("click", closeDrawer);
    $("#scrim").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

    window.BizApps = {
      product: openDrawer,
      layer: function (id) { if (window.__focus) window.__focus(id); },
      explode: function (on) { if (stage && !stage.failed) { stage.setExplode(on); $("#tExplode").classList.toggle("on", on); } },
      reset: function () { closeDrawer(); if (stage && !stage.failed) stage.resetView(); },
      stage: function () { return stage; },
    };
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
  /* ---- full screen (shared with the city page) ------------------------- */
  (function () {
    function wire() {
      if (!window.FS) return;
      window.FS.bind(document.getElementById("cFull"), document.getElementById("cFullTxt"));
      document.addEventListener("keydown", function (e) {
        if (e.target && /input|textarea/i.test(e.target.tagName)) return;
        if ((e.key || "").toLowerCase() === "f") { window.FS.toggle(); e.preventDefault(); }
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", wire);
    else wire();
  })();

})();
</script>
<script>
/* Mobile navigation. Closes on selection, on Escape and on resize back to the
   desktop layout, so it can never be left open and orphaned. */
(function () {
  var tog = document.getElementById("navTog"), nav = document.getElementById("nav");
  if (!tog || !nav) return;
  function set(open) {
    nav.classList.toggle("open", open);
    tog.setAttribute("aria-expanded", open ? "true" : "false");
  }
  tog.addEventListener("click", function () {
    set(tog.getAttribute("aria-expanded") !== "true");
  });
  nav.addEventListener("click", function (e) { if (e.target.tagName === "A") set(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") set(false); });
  window.addEventListener("resize", function () { if (innerWidth > 1080) set(false); });
})();
</script>
